[project]
name = "ovops"
version = "0.1.0"
description = "OuValve-Ops: 瓯阀智枢 —— 跨系统数据穿透与智能运维 Agent"
authors = [
    { name = "OuValve Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "langgraph>=0.2.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
include = ["ovops*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
